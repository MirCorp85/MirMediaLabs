plugins {
    id 'com.android.application'
}

// Release signing comes from keystore.properties (private, gitignored ??? never commit it or the .jks).
def ksFile = rootProject.file("keystore.properties")
def ks = new Properties()
if (ksFile.exists()) { ks.load(new FileInputStream(ksFile)) }

android {
    namespace 'com.mirmedialabs.app'
    compileSdk 36

    defaultConfig {
        applicationId "com.mirmedialabs.app"
        minSdk 24
        targetSdk 34
        versionCode 46
        versionName "2.19"
    }

    buildFeatures { buildConfig true }

    // Two editions from ONE codebase - every feature ships in both unless gated on BuildConfig.PLAY.
    //   direct : GitHub / own lab update server, self-updater (the original app)
    //   play   : Google Play - no self-updater / install permissions, in-app content reporting
    flavorDimensions "store"
    productFlavors {
        direct {
            dimension "store"
            buildConfigField "boolean", "PLAY", "false"
        }
        play {
            dimension "store"
            buildConfigField "boolean", "PLAY", "true"
            targetSdk 36                                     // Play's current target-API requirement
        }
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile rootProject.file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig ksFile.exists() ? signingConfigs.release : null
            debuggable false
        }
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    // QR decoding for the invite scanner (pure Java, Apache-2.0)
    implementation 'com.google.zxing:core:3.5.3'
}
