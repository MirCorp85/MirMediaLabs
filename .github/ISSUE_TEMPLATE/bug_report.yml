name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: App version
      description: About menu - version
      placeholder: v1.23
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Windows PC app, Android phone, Android TV, Web browser]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Include what you expected instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Last ~50 lines of data/logs/server_err.log. Remove anything private.
      render: text
