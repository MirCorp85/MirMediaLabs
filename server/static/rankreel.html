<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080A">
<title>MIR RANK REEL · Producer</title>
<link rel="icon" href="static/icon-512.png">
<script src="static/mir-icons.js"></script>
<!-- RANK REEL producer (server/rankreel_wizard.py), modelled on the EXPLAINED producer (explained.html):
     projects rail · hero + 5-phase pipeline · one "needs you" bar · a body per stage (Moments / Clips / Script / Final).
     Sources are 9:16 Shorts first (rankreel.find_sources). Signature look, MIR ICONS only. -->
<style>
:root{--amb:#FFB547;--bg:#08080A;--panel:#111114;--panel2:#16161B;--raise:#1D1D23;--ink:#F2F6FA;--cyan:#5CE1E6;--ok:#5FD38D;--bad:#FF5A5F;--teal:#2dd4bf;
  --dim:color-mix(in srgb,var(--ink) 64%,transparent);--faint:color-mix(in srgb,var(--ink) 40%,transparent);
  --line:color-mix(in srgb,var(--ink) 9%,transparent);--line2:color-mix(in srgb,var(--ink) 18%,transparent);--ambs:color-mix(in srgb,var(--amb) 14%,transparent);
  --sans:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"Cascadia Mono",Consolas,monospace}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:13px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
.mi{display:inline-flex;width:15px;height:15px;vertical-align:-3px;flex:none}.mi svg{width:100%;height:100%}
::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:var(--line2);border-radius:9px;border:2px solid var(--bg)}
.top{display:flex;align-items:center;gap:10px;height:54px;padding:0 16px;border-bottom:1px solid var(--line);background:#0B0B0E}
.logo{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--ambs);color:var(--amb);border:1px solid color-mix(in srgb,var(--amb) 35%,transparent)}
.brand{font-weight:800;letter-spacing:.26em;font-size:12px}.brand em{font-style:normal;color:var(--amb)}
.brand small{display:block;font-weight:600;letter-spacing:.16em;font-size:9px;color:var(--faint);margin-top:1px}
.sp{flex:1}
.b{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:34px;padding:0 13px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;white-space:nowrap}
.b:hover{border-color:color-mix(in srgb,var(--amb) 70%,transparent)}.b:disabled{opacity:.35;cursor:default}
.b.pri{background:var(--amb);border-color:transparent;color:#140E02;font-weight:700}.b.pri:hover{background:#ffc56e}
.b.ghost{background:transparent;border-color:transparent;color:var(--dim)}.b.ghost:hover{color:var(--ink);background:var(--panel2)}
.b.ico{width:34px;padding:0}.b.sm{height:28px;padding:0 10px;font-size:12px;border-radius:8px}.b.sm.ico{width:28px;padding:0}.b.bad{color:var(--bad)}
.app{display:grid;grid-template-columns:270px minmax(0,1fr);height:calc(100dvh - 54px)}
.side{border-right:1px solid var(--line);overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:6px;background:#0A0A0D}
.side-hd{display:flex;justify-content:space-between;padding:2px 6px 6px;font-size:10px;letter-spacing:.2em;color:var(--faint);font-weight:700}
.run{position:relative;display:flex;gap:10px;align-items:center;padding:8px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.run:hover{background:var(--panel)}.run.on{background:var(--panel2);border-color:var(--line2)}
.run.on::before{content:"";position:absolute;left:-10px;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--amb)}
.rth{width:40px;aspect-ratio:9/16;border-radius:6px;overflow:hidden;flex:none;background:var(--raise);display:grid;place-items:center;color:var(--faint)}
.rth img{width:100%;height:100%;object-fit:cover}
.rtx{min-width:0;flex:1}.rtx b{display:block;font-size:13px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.rtx small{display:flex;align-items:center;gap:6px;color:var(--faint);font-size:11px;margin-top:3px}
.racts{position:absolute;right:6px;top:6px;opacity:0}.run:hover .racts{opacity:1}.racts .b{background:rgba(10,10,13,.92)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--faint);flex:none}
.s-running .dot{background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:pu 1.6s ease-in-out infinite}.s-waiting .dot{background:var(--amb);box-shadow:0 0 8px var(--amb)}
.s-error .dot{background:var(--bad)}.s-done .dot{background:var(--ok)}
@keyframes pu{50%{opacity:.35}}
.main{overflow:auto}.pg{max-width:1180px;margin:0 auto;padding:20px 26px 80px}
.hero{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--line2);background:var(--panel)}
.hero-pat{position:absolute;inset:0;background:radial-gradient(600px 220px at 85% 0%,color-mix(in srgb,var(--amb) 16%,transparent),transparent 70%),
  repeating-linear-gradient(90deg,var(--line) 0 1px,transparent 1px 48px),repeating-linear-gradient(0deg,var(--line) 0 1px,transparent 1px 48px);opacity:.7}
.hero-in{position:relative;display:flex;gap:18px;align-items:center;padding:20px}
.ttl{flex:1;min-width:0}.kick{color:var(--amb);font-size:10px;letter-spacing:.24em;font-weight:800}
.ttl h1{margin:4px 0 8px;font-size:22px;line-height:1.2;font-weight:800;text-transform:uppercase;white-space:pre-line}.ttl h1 .kw{color:var(--teal)}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:20px;font-size:11px;background:rgba(0,0,0,.35);border:1px solid var(--line2);color:var(--dim);margin:0 4px 4px 0}
.pipe{position:relative;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));padding:4px 20px 18px}
.pn{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px}
.pn+.pn::before{content:"";position:absolute;top:16px;right:calc(50% + 20px);left:calc(-50% + 20px);height:2px;border-radius:2px;background:var(--line2)}
.pn.done::before,.pn.now::before,.pn.wait::before,.pn.fail::before{background:var(--ok)}
.pc{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line2);background:var(--panel);color:var(--faint)}
.pn b{font-size:12px;font-weight:600;color:var(--faint)}.pn small{font-size:10px;color:var(--faint);height:14px}
.pn.done .pc{background:color-mix(in srgb,var(--ok) 14%,var(--panel));border-color:var(--ok);color:var(--ok)}.pn.done b{color:var(--dim)}
.pn.now .pc{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 0 5px color-mix(in srgb,var(--cyan) 12%,transparent)}.pn.now b{color:var(--ink)}.pn.now small{color:var(--cyan)}
.pn.wait .pc{background:var(--amb);border-color:var(--amb);color:#140E02;box-shadow:0 0 0 5px var(--ambs),0 0 22px -4px var(--amb)}.pn.wait b,.pn.wait small{color:var(--amb)}
.pn.fail .pc{border-color:var(--bad);color:var(--bad)}.pn.fail small{color:var(--bad)}
.apv{display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-top:14px;padding:16px 18px;border-radius:16px;
  border:1px solid color-mix(in srgb,var(--amb) 55%,transparent);background:linear-gradient(100deg,color-mix(in srgb,var(--amb) 15%,transparent),color-mix(in srgb,var(--amb) 4%,transparent))}
.apv .ai{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--amb);color:#140E02;flex:none}.apv .ai .mi{width:20px;height:20px}
.apv .at{flex:1;min-width:220px}.apv .at b{font-size:15px}.apv .at div{color:var(--dim);font-size:12px;margin-top:2px}.apv .ab{display:flex;gap:8px;flex-wrap:wrap}
.apv.run{border-color:color-mix(in srgb,var(--cyan) 45%,transparent);background:linear-gradient(100deg,color-mix(in srgb,var(--cyan) 12%,transparent),transparent)}.apv.run .ai{background:var(--cyan)}
.apv.err{border-color:color-mix(in srgb,var(--bad) 55%,transparent);background:color-mix(in srgb,var(--bad) 9%,transparent)}.apv.err .ai{background:var(--bad);color:#fff}
.bar{height:4px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:var(--cyan);transition:width .6s}
.sh{display:flex;align-items:center;gap:8px;margin:26px 0 12px;font-size:11px;letter-spacing:.18em;color:var(--dim);text-transform:uppercase;font-weight:700}
.sh .x{letter-spacing:0;text-transform:none;font-weight:500;color:var(--faint)}
.empty{color:var(--faint);padding:34px 0;text-align:center}
input.tx,textarea,select.tx{width:100%;background:rgba(0,0,0,.35);border:1px solid var(--line2);border-radius:9px;padding:8px 11px}
select.tx{color-scheme:dark}textarea{resize:vertical;min-height:58px}
input.tx:focus,textarea:focus,select.tx:focus{outline:none;border-color:var(--amb)}
/* moments list */
.mrow{display:grid;grid-template-columns:44px minmax(0,170px) minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--panel);margin-bottom:6px}
.rk{font:200 28px/1 var(--sans);color:var(--amb);text-align:center}.rk.one{color:var(--teal);font-weight:400}
.mrow small{display:block;color:var(--faint);font-size:11px;margin-top:3px}.mbt{display:flex;gap:3px}
/* clips — one editor row per clip: 9:16 video left, title + cut tools right (always on screen together) */
.cg{display:flex;flex-direction:column;gap:12px}
.cc{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:12px}
.cc.on{border-color:var(--amb)}
.cv{position:relative;width:220px;aspect-ratio:9/16;border-radius:11px;overflow:hidden;background:#000;display:grid;place-items:center;color:var(--faint);align-self:start}
.cv video,.cv img{width:100%;height:100%;object-fit:cover;display:block}.cv video.land{object-fit:contain}
.cv .badge{position:absolute;right:8px;top:8px;font:700 10px var(--sans);letter-spacing:.08em;padding:3px 7px;border-radius:6px;background:rgba(0,0,0,.65);pointer-events:none}
.badge.v{color:var(--teal)}.badge.h{color:var(--amb)}
.cv .busy{position:absolute;inset:0;display:grid;place-items:center;background:linear-gradient(110deg,transparent 30%,color-mix(in srgb,var(--amb) 22%,transparent) 50%,transparent 70%) 0 0/250% 100%;animation:shm 1.6s linear infinite;font:800 10px var(--sans);letter-spacing:.2em;color:var(--amb)}
@keyframes shm{to{background-position:-200% 0}}
.cb{display:flex;flex-direction:column;gap:10px;min-width:0}
.ch{display:flex;gap:12px;align-items:flex-start}
.ch .rk2{font:200 40px/1 var(--sans);color:var(--amb);min-width:46px}.ch .rk2.one{color:var(--teal);font-weight:400}
.ch .tt{flex:1;min-width:0}.ch h3{margin:2px 0 3px;font-size:18px;line-height:1.2}
.ch .why{font-size:12px;color:var(--dim)}.ch .src{font-size:11px;color:var(--faint);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:3px}
.ch .src a{color:var(--faint)}.ch .qc{font-size:11px;color:var(--ok);margin-top:3px}
.cut{border:1px solid var(--line);border-radius:12px;background:var(--bg);padding:10px 12px}
.cut .hd{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:.16em;color:var(--faint);font-weight:700;margin-bottom:8px}
.cut .hd .sp{flex:1}.cut .hd b{color:var(--ink);letter-spacing:0;font:600 12px var(--mono)}
.tl{position:relative;height:30px;border-radius:7px;background:var(--raise);cursor:pointer;overflow:hidden}
.tl .win{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--amb) 32%,transparent);border-left:2px solid var(--amb);border-right:2px solid var(--amb)}
.tl .ph{position:absolute;top:-2px;bottom:-2px;width:2px;background:#fff;box-shadow:0 0 6px #fff;pointer-events:none}
.tl .tk{position:absolute;bottom:2px;font:9px var(--mono);color:var(--faint);pointer-events:none}
.cutb{display:flex;gap:6px;flex-wrap:wrap;align-items:end;margin-top:10px}
.cutb .f{display:flex;flex-direction:column;gap:3px}.cutb .f label{font-size:10px;color:var(--faint);letter-spacing:.08em}.cutb .f input{width:86px}
.tr{display:none}
.cutmsg{font-size:11px;color:var(--faint);margin-top:6px;min-height:14px}
@media (max-width:760px){.cc{grid-template-columns:1fr}.cv{width:min(100%,260px);justify-self:center}
  .cutb{display:grid;grid-template-columns:1fr 1fr}.cutb .sp{display:none}.cutb>.b:first-child{grid-column:1/-1}.cutb .f input{width:100%}}
.cands{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px}
.cand{all:unset;position:relative;flex:none;width:52px;aspect-ratio:9/16;border-radius:6px;overflow:hidden;cursor:pointer;border:1px solid var(--line2);background:var(--raise)}
.cand img{width:100%;height:100%;object-fit:cover}.cand.on{border:2px solid var(--amb)}
.cand i{position:absolute;left:0;right:0;bottom:0;font:700 8px var(--sans);text-align:center;background:rgba(0,0,0,.7);color:var(--dim);padding:1px 0}
.cand i.v{color:var(--teal)}
.err{color:#ffb3b5;font-size:12px}
/* script */
.sg{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.box{border:1px solid var(--line);border-radius:16px;background:var(--panel);padding:16px}
.fld{margin-top:12px}.fld:first-child{margin-top:0}.fld label{display:block;font-size:12px;font-weight:600;margin-bottom:5px}.fld .h{font-size:11px;color:var(--faint);margin:-3px 0 5px}
.vrow{display:grid;grid-template-columns:40px 64px minmax(0,1fr);gap:10px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.vrow img{width:40px;aspect-ratio:9/16;object-fit:cover;border-radius:5px;background:var(--raise)}
.prev{position:sticky;top:12px}
.phone{aspect-ratio:9/16;border-radius:18px;overflow:hidden;background:#000;border:1px solid var(--line2);position:relative}
.phone .tb{position:absolute;inset:0 0 auto;height:20%;background:#000;display:grid;place-items:center;text-align:center;padding:0 8%;font:900 15px/1.1 var(--sans);text-transform:uppercase;white-space:pre-line}
.phone .tb .kw{color:var(--teal)}
.phone .ld{position:absolute;left:5%;top:23%;font:900 13px/1.5 var(--sans);color:#fff;-webkit-text-stroke:3px #000;paint-order:stroke fill}
.phone img{position:absolute;top:20%;left:0;width:100%;height:80%;object-fit:cover;opacity:.75}
/* final */
.fin{display:grid;grid-template-columns:minmax(0,360px) minmax(0,1fr);gap:20px;align-items:start}
.fin video{width:100%;aspect-ratio:9/16;border-radius:16px;background:#000;border:1px solid var(--line2)}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:12px}.kv>span:nth-child(odd){color:var(--faint)}.kv code{font:11px var(--mono);word-break:break-all}
.lg{font-size:12px;color:var(--dim);max-height:220px;overflow:auto}.lg div{padding:3px 0}.lg time{font:11px var(--mono);color:var(--faint);margin-right:8px}
.lg .l-done{color:var(--ok)}.lg .l-warn{color:var(--amb)}.lg .l-error{color:var(--bad)}.lg .l-need{color:var(--amb);font-weight:700}
.hello{display:grid;place-items:center;text-align:center;min-height:70vh;padding:30px}.hello h2{margin:14px 0 6px;font-size:22px}.hello p{color:var(--dim);margin:0 0 18px;max-width:440px}
dialog{border:1px solid var(--line2);border-radius:18px;background:#121216;color:var(--ink);padding:0;width:min(480px,calc(100vw - 32px))}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
.nd{padding:22px}.nd h2{margin:0 0 4px;font-size:19px}.nd p{margin:0 0 14px;color:var(--dim)}.nd label.l{display:block;font-size:12px;font-weight:600;margin:12px 0 5px}
.tg2{display:flex;gap:10px;align-items:flex-start;margin-top:14px;padding:12px;border-radius:11px;background:var(--panel2);cursor:pointer}
.tg2 input{accent-color:var(--amb);width:16px;height:16px;margin-top:2px}.tg2 small{display:block;color:var(--faint)}
.nd .f{display:flex;gap:8px;justify-content:flex-end;margin-top:20px}.row2{display:flex;gap:8px}
@media (max-width:900px){.sg,.fin{grid-template-columns:1fr}.prev{position:static;max-width:300px}}
@media (max-width:760px){.app{grid-template-columns:minmax(0,1fr);height:auto}.main{overflow:visible}
  .side{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 12px}.side-hd{display:none}.run{flex:none;width:220px;background:var(--panel)}.run.on::before{display:none}
  .pg{padding:14px 16px 70px}.hero-in{flex-direction:column;align-items:stretch}.pipe{padding:4px 6px 14px}.pn small{display:none}.pn b{font-size:10px}
  .mrow{grid-template-columns:34px minmax(0,1fr) auto}.mrow .q{grid-column:1/-1}.brand small{display:none}.top .b.pri span{display:none}}
</style>
</head>
<body>
<div class="top">
  <span class="logo"><i class="mi" data-ic="star"></i></span>
  <span class="brand">MIR <em>RANK REEL</em><small>PRODUCER</small></span>
  <span class="sp"></span>
  <button class="b pri" onclick="openNew()"><i class="mi" data-ic="plus"></i><span>New rank reel</span></button>
  <button class="b ico ghost" title="Refresh" onclick="refresh()"><i class="mi" data-ic="refresh"></i></button>
  <button class="b ico ghost" title="Close" onclick="xClose()"><i class="mi" data-ic="close"></i></button>
</div>
<div class="app">
  <aside class="side"><div class="side-hd"><span>REELS</span><span id="nruns"></span></div><div id="runs" style="display:contents"></div></aside>
  <main class="main" id="main"><div class="pg"><div class="empty">Loading…</div></div></main>
</div>
<dialog id="nd"><div class="nd">
  <h2>New rank reel</h2><p>Give a topic. MirAI picks the moments, finds vertical Shorts for each, writes the voice-over and cuts a 9:16 ranking Short. You check each step.</p>
  <label class="l" for="topic">Topic</label>
  <input class="tx" id="topic" placeholder="e.g. Real Madrid vs Barcelona — best moments of all time">
  <label class="l" for="ncount">How many moments</label>
  <select class="tx" id="ncount"><option>5</option><option selected>6</option><option>7</option></select>
  <label class="l" for="nvo">Voice</label>
  <div class="row2"><select class="tx" id="nvo"></select><button type="button" class="b ico" title="Hear this voice" onclick="vPlay('#nvo')"><i class="mi" data-ic="play"></i></button></div>
  <label class="tg2"><input type="checkbox" id="nauto"><span>Fully automatic<small>MirAI does everything — plans spare moments, skips clips it can't find, writes and voices it — and stops at the finished video for you to watch. Untick to approve each step.</small></span></label>
  <div class="f"><button class="b ghost" onclick="$('#nd').close()">Cancel</button><button class="b pri" onclick="startRun()"><i class="mi" data-ic="sparkle"></i> Make the reel</button></div>
</div></dialog>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ic=n=>`<i class="mi" data-ic="${n}"></i>`;
const LS={get:k=>{try{return localStorage.getItem(k)}catch(e){return null}},set:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},del:k=>{try{localStorage.removeItem(k)}catch(e){}}};
let SEL=LS.get('rr_sel')||'', CUR=null, RUNS=[], VOICES=[], VAUDIO=null, MOM=null, MOM_ID='';
async function api(u,b){const r=await fetch(u,b?{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)}:{});
  const j=await r.json().catch(()=>({error:r.statusText}));if(!r.ok)throw new Error(j.error||r.statusText);return j}
function put(el,h){if(!el||el._h===h)return false;el._h=h;el.innerHTML=h;MI.hydrate&&MI.hydrate(el);return true}
const ago=t=>{const s=Date.now()/1000-t;return s<60?'now':s<3600?Math.round(s/60)+'m ago':s<86400?Math.round(s/3600)+'h ago':Math.round(s/86400)+'d ago'};
const views=n=>n>=1e6?(n/1e6).toFixed(1)+'M':n>=1e3?Math.round(n/1e3)+'K':String(n||0);
const STATE={running:'Working',waiting:'Needs you',error:'Stopped',done:'Done'};
function titleHtml(t,kw){const keys=String(kw||'').split(',').map(s=>s.trim()).filter(Boolean);let h=esc(t||'');
  keys.forEach(k=>{h=h.replace(new RegExp('('+k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig'),'<span class="kw">$1</span>')});return h}

/* ── voices (Media Lab Kokoro) ── */
async function loadVoices(){try{VOICES=(await api('api/tts/voices')).voices||[]}catch(e){VOICES=[]}}
const vOpts=cur=>VOICES.map(v=>`<option value="${v.id}" ${v.id===cur?'selected':''}>${esc(v.label)}</option>`).join('');
function vPlay(sel){const id=$(sel).value;try{VAUDIO&&VAUDIO.pause()}catch(e){}
  VAUDIO=new Audio('api/tts?'+new URLSearchParams({voice:id,text:'Number one. Nobody saw that coming.'}));VAUDIO.play().catch(()=>{})}

/* ── new ── */
function openNew(){$('#nvo').innerHTML=vOpts(LS.get('rr_voice')||'am_michael');$('#nauto').checked=LS.get('rr_auto')!=='0';$('#nd').showModal();setTimeout(()=>$('#topic').focus(),30)}
async function startRun(){try{const p=await api('api/rankreel/start',{topic:$('#topic').value,count:+$('#ncount').value,voice:$('#nvo').value,auto:$('#nauto').checked});
  LS.set('rr_voice',$('#nvo').value);LS.set('rr_auto',$('#nauto').checked?'1':'0');$('#nd').close();$('#topic').value='';sel(p.id)}catch(e){alert(e.message)}}

/* ── actions ── */
async function act(a,b){try{CUR=await api(`api/rankreel/${SEL}/${a}`,b||{});MOM=null;paint()}catch(e){alert(e.message)}refresh()}
let ESEQ=0;   // bumped by every edit — a poll that started before an edit is stale and must not repaint over it
async function edit(b){ESEQ++;try{CUR=await api(`api/rankreel/${SEL}/edit`,b)}catch(e){alert(e.message)}ESEQ++}
async function delRun(id){if(!confirm('Remove this reel project? Rendered videos stay in the library and OUTPUTS.'))return;
  try{await api(`api/rankreel/${id}/delete`,{})}catch(e){}if(SEL===id){SEL='';LS.del('rr_sel')}refresh()}
function sel(id){SEL=id;LS.set('rr_sel',id);MOM=null;$('#main').scrollTop=0;$('#main')._h='';$('#main')._pid='';refresh()}
function redo(step){const w={moments:'re-plan the moments (clips and script are redone after)',clips:'search and download every clip again',script:'rewrite every voice-over line',render:'render the reel again'}[step];
  if(confirm(`Redo: ${w}?`))act('redo',{step})}

/* ── polling: only touch the DOM when markup changed; pause while typing / playing ── */
let BUSY=false, AGAIN=false;
async function refresh(){if(BUSY){AGAIN=true;return}BUSY=true;AGAIN=false;
  try{try{RUNS=(await api('api/rankreel/runs')).runs||[]}catch(e){RUNS=[]}
    $('#nruns').textContent=RUNS.length||'';
    put($('#runs'),RUNS.map(r=>`<div class="run s-${r.state} ${r.id===SEL?'on':''}" onclick="sel('${r.id}')">
      <div class="rth">${r.thumb?`<img loading="lazy" src="${esc(r.thumb)}" alt="">`:ic('star')}</div>
      <div class="rtx"><b>${esc(String(r.title||'').replace(/\n/g,' '))}</b><small><span class="dot"></span>${STATE[r.state]||r.state} · ${ago(r.updated||r.created)}</small></div>
      <div class="racts"><button class="b sm ico bad" title="Delete" onclick="event.stopPropagation();delRun('${r.id}')">${ic('trash')}</button></div></div>`).join('')
      ||'<div class="empty" style="padding:20px 0">No reels yet.</div>');
    if(!SEL&&RUNS[0])SEL=RUNS[0].id;
    if(!SEL)return welcome();
    const seq=ESEQ;let fresh;
    try{fresh=await api('api/rankreel/'+SEL)}catch(e){SEL='';LS.del('rr_sel');return welcome()}
    if(seq!==ESEQ)return;                          // an edit happened mid-poll: this answer is older than what's on screen
    CUR=fresh;paint()}finally{BUSY=false;if(AGAIN)refresh()}}
function welcome(){put($('#main'),`<div class="hello"><div><div class="logo" style="width:64px;height:64px;margin:auto;border-radius:18px">${ic('star').replace('class="mi"','class="mi" style="width:30px;height:30px"')}</div>
  <h2>Make a ranking Short</h2><p>5–7 viral moments, ranked, #1 saved for last. MirAI finds vertical Shorts for each, writes the voice-over and cuts the 9:16 video. You approve each step.</p>
  <button class="b pri" onclick="openNew()">${ic('plus')} New rank reel</button></div></div>`)}

const PH=[['moments','Moments','sparkle'],['clips','Clips','film'],['script','Script','note'],['render','Render','video'],['publish','Publish','send']];
function phase(p,k){const i=PH.findIndex(x=>x[0]===k),cur=p.stage==='done'?5:PH.findIndex(x=>x[0]===p.stage);
  if(p.state==='done'||i<cur)return 'done';if(i>cur)return '';
  return p.state==='error'?'fail':p.state==='waiting'?(p.wait==='final'&&k==='render'?'done':'wait'):'now'}
function paint(){const p=CUR;if(!p)return;
  // a waiting "final" means render is done and Publish needs you
  const ph=PH.map(([k,l,n])=>{let s=phase(p,k);if(p.wait==='final'&&k==='publish')s='wait';
    return `<div class="pn ${s}"><div class="pc">${ic(s==='done'?'check':n)}</div><b>${l}</b><small>${{done:'done',now:'working',wait:'needs you',fail:'stopped'}[s]||''}</small></div>`}).join('');
  const ready=(p.moments||[]).filter(m=>m.status==='ready').length;
  const hero=`<div class="hero"><div class="hero-pat"></div><div class="hero-in"><div class="ttl"><div class="kick">RANK REEL · ${esc(p.topic||'')}</div>
    <h1>${p.title?titleHtml(p.title,p.keywords):'Planning…'}</h1>
    <span class="pill">${STATE[p.state]||p.state}</span><span class="pill">${ic('star')} ${(p.moments||[]).length} moments</span>${ready?`<span class="pill">${ic('film')} ${ready} clips ready</span>`:''}
    <span class="pill">${ic('mic')} ${esc(((VOICES.find(v=>v.id===p.voice)||{}).label||p.voice||'').split(' · ')[0])}</span>${p.auto?`<span class="pill">${ic('wand')} automatic</span>`:''}</div></div>
    <div class="pipe">${ph}</div></div>`;
  const main=$('#main');      // sections update independently: a new log line no longer rebuilds the clips (and stops their videos)
  if(main._pid!==p.id||!$('#hero')){main._pid=p.id;main._h='';main.innerHTML=`<div class="pg"><div id="hero"></div><div id="bar"></div><div id="body"></div><div class="sh">${ic('clock')} Log</div><div class="lg box" id="log"></div></div>`;MI.hydrate&&MI.hydrate(main)}
  put($('#hero'),hero);put($('#bar'),bar(p));
  const b=$('#body');if(p.stage==='clips'||(p.stage==='script'&&p.state==='running'))syncClips(b,p);else{if(b._mode){b._mode='';b._h=''}put(b,body(p))}
  put($('#log'),(p.log||[]).slice().reverse().map(l=>`<div class="l-${l.lvl}"><time>${new Date(l.t*1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</time>${esc(l.msg)}</div>`).join(''))}
function bar(p){
  if(p.state==='running'){const pct=p.stage==='render'?((p.render||{}).pct||0):null;
    return `<div class="apv run"><div class="ai">${ic('sparkle')}</div><div class="at"><b>${{moments:'Planning the moments',clips:'Finding and downloading the clips',script:'Writing the voice-over',render:'Recording the voice and rendering',publish:'Finishing'}[p.stage]||'Working'}…</b>
      <div>${esc(p.stage_note||'')}</div>${pct!==null?`<div class="bar"><i style="width:${pct}%"></i></div>`:''}</div></div>`}
  if(p.state==='error')return `<div class="apv err"><div class="ai">${ic('close')}</div><div class="at"><b>That step stopped</b><div>${esc(p.error||'')}</div></div>
    <div class="ab"><button class="b pri" onclick="act('redo',{step:'${p.stage==='publish'?'render':p.stage}'})">${ic('refresh')} Try again</button></div></div>`;
  if(p.state==='done')return `<div class="apv" style="border-color:color-mix(in srgb,var(--ok) 45%,transparent);background:color-mix(in srgb,var(--ok) 7%,transparent)"><div class="ai" style="background:var(--ok)">${ic('check')}</div>
    <div class="at"><b>Done</b><div>${p.post?'A Social draft is waiting for your approval in Social.':'Saved to the library and OUTPUTS · MEDIA · Rank Reels.'}</div></div>
    <div class="ab"><button class="b" onclick="act('back',{step:'clips'})">${ic('film')} Edit clips</button><button class="b" onclick="redo('render')">${ic('refresh')} Re-render</button></div></div>`;
  if(p.state!=='waiting')return '';
  const W={moments:['Check the moments','Edit, reorder or remove — #1 is the one saved for last. Each search finds a vertical Short.',`<button class="b pri" onclick="approveMoments()">${ic('film')} Find the clips</button>`],
    clips:['Check the clips','Swap a pick, paste your own link, or change where each clip starts. Vertical (9:16) Shorts are picked first.',`<button class="b pri" onclick="act('approve')">${ic('note')} Write the script</button>`],
    script:['Check the script','Title, highlight words, voice and each voice-over line.',`<button class="b pri" onclick="approveScript()">${ic('video')} Render the reel</button><button class="b ghost" onclick="act('back',{step:'clips'})">${ic('film')} Back to clips</button>`],
    final:['Final cut ready','Watch it. Make a Social draft (you still approve the post in Social) or finish without posting.',
      `<button class="b pri" onclick="act('approve',{draft:true})">${ic('send')} Make Social draft</button><button class="b" onclick="act('approve',{draft:false})">${ic('check')} Finish</button><button class="b ghost" onclick="act('back',{step:'script'})">${ic('note')} Back to script</button><button class="b ghost" onclick="act('back',{step:'clips'})">${ic('film')} Back to clips</button>`]}[p.wait];
  return W?`<div class="apv"><div class="ai">${ic('star')}</div><div class="at"><b>${W[0]}</b><div>${W[1]}</div></div><div class="ab">${W[2]}</div></div>`:''}

function body(p){
  if(p.stage==='moments'&&p.state!=='running')return moments(p);
  if(p.stage==='moments')return `<div class="empty">${ic('sparkle')} Thinking up the best moments…</div>`;
  if(p.stage==='clips')return clips(p);
  if(p.stage==='script')return p.state==='running'?clips(p):script(p);
  return final(p)}

/* MOMENTS — local editable copy, saved on change */
function moments(p){if(!MOM||MOM_ID!==p.id){MOM=(p.moments||[]).map(m=>({label:m.label,query:m.query,why:m.why}));MOM_ID=p.id}
  return `<div class="sh">${ic('star')} The ranking <span class="x">· top = #1 (plays last)</span></div>`+MOM.map((m,i)=>`<div class="mrow">
    <div class="rk ${i?'':'one'}">${i+1}</div>
    <div><input class="tx" value="${esc(m.label)}" placeholder="On-screen label" onchange="MOM[${i}].label=this.value;saveMom()"></div>
    <div class="q"><input class="tx" value="${esc(m.query)}" placeholder="YouTube search — names, place, year" onchange="MOM[${i}].query=this.value;saveMom()">${m.why?`<small>${esc(m.why)}</small>`:''}</div>
    <div class="mbt"><button class="b sm ico ghost" title="Up" onclick="mv(${i},-1)" ${i?'':'disabled'}>${ic('chevron-down').replace('class="mi"','class="mi" style="transform:rotate(180deg)"')}</button>
      <button class="b sm ico ghost" title="Down" onclick="mv(${i},1)" ${i<MOM.length-1?'':'disabled'}>${ic('chevron-down')}</button>
      <button class="b sm ico ghost bad" title="Remove" onclick="MOM.splice(${i},1);saveMom(true)">${ic('trash')}</button></div></div>`).join('')
    +`<div style="display:flex;gap:8px;margin-top:10px">${MOM.length<8?`<button class="b sm" onclick="MOM.push({label:'',query:''});saveMom(true)">${ic('plus')} Add a moment</button>`:''}
      <button class="b sm ghost" onclick="redo('moments')">${ic('refresh')} New ideas</button></div>`}
function mv(i,d){const t=MOM[i];MOM[i]=MOM[i+d];MOM[i+d]=t;saveMom(true)}
async function saveMom(rep){await edit({moments:MOM});if(rep){$('#body')._h='';put($('#body'),moments(CUR))}}
async function approveMoments(){if(MOM&&MOM.filter(m=>m.query).length<3)return alert('A ranking needs at least 3 moments with a search.');
  await act('approve',{moments:MOM})}

/* CLIPS — one editor row per clip: the video (full controls to scrub the whole source) + title + cut timeline */
const tc=s=>{s=Math.max(0,+s||0);return Math.floor(s/60)+':'+(s%60).toFixed(1).padStart(4,'0')};
const clipsHead=()=>`<div class="sh">${ic('film')} Clips <span class="x">· scrub the video, then Set start / Set end · click another shot below a clip to swap it · teal 9:16 = vertical Short · amber 16:9 = shown whole on blur</span></div>`;
// one clip row. busy = a whole-reel step is running (cutting/swapping waits); this clip's own download only locks THIS row.
function rowHtml(m,busy){
  const land=(m.aspect||0.56)>1.05, mine=['finding','downloading'].includes(m.status), wip=mine||(busy&&m.status==='todo'), lock=busy||mine;
  const a=+m.trimIn||0, d=+m.dur||6, ln=+m.length||Math.max(a+d,1);
  const vid=m.src?`<video class="${land?'land':''}" id="v${m.rank}" src="media/${encodeURIComponent(m.src)}#t=${a}" playsinline controls preload="metadata"
    data-a="${a}" data-d="${d}" data-ln="${ln}" ontimeupdate="vTick(this)"></video>`:(m.thumb?`<img src="${esc(m.thumb)}" alt="">`:ic('film'));
  const src=m.pick?(((m.cands||[]).find(c=>c.url===m.pick)||{}).title||m.pick):'';
  const ticks=[0,.25,.5,.75].map(f=>`<span class="tk" style="left:${f*100}%">&nbsp;${tc(ln*f)}</span>`).join('');
  return `<div class="cc ${mine?'on':''}" id="cc${m.rank}"><div class="cv">${vid}${m.src?`<span class="badge ${land?'h':'v'}">${land?'16:9':'9:16'}</span>`:''}
    ${wip?`<div class="busy">${m.status==='finding'?'SEARCHING':'DOWNLOADING NEW SHOT'}</div>`:''}</div>
    <div class="cb"><div class="ch"><div class="rk2 ${m.rank===1?'one':''}">#${m.rank}</div><div class="tt"><h3>${esc(m.label)}</h3>
      ${m.why?`<div class="why">${esc(m.why)}</div>`:''}
      ${m.pick?`<div class="src">Source: <a href="${esc(m.pick)}" target="_blank" rel="noopener" title="${esc(m.pick)}">${esc(src)}</a></div>`:''}
      ${m.qc?`<div class="qc">${ic('check')} ${esc(m.qc)}</div>`:''}${m.err?`<div class="err">${esc(m.err)}</div>`:''}</div></div>
    ${m.src&&!mine?`<div class="cut"><div class="hd">${ic('scissors')} CUT <span class="sp"></span><b>${tc(a)} → ${tc(a+d)}</b> <span>(${d.toFixed(1)} s of ${tc(ln)})</span></div>
      <div class="tl" onclick="tlSeek(event,${m.rank})"><div class="win" style="left:${a/ln*100}%;width:${d/ln*100}%"></div><div class="ph" id="ph${m.rank}" style="left:${a/ln*100}%"></div>${ticks}</div>
      <div class="cutb"><button class="b sm" onclick="playCut(${m.rank})">${ic('play')} Play cut</button>
        <button class="b sm" ${busy?'disabled':''} title="Start the clip at the video's current frame" onclick="setCut(${m.rank},'start')">${ic('scissors')} Set start here</button>
        <button class="b sm" ${busy?'disabled':''} title="End the clip at the video's current frame" onclick="setCut(${m.rank},'end')">${ic('scissors')} Set end here</button>
        <span class="sp" style="flex:1"></span>
        <div class="f"><label>START (s)</label><input class="tx" type="number" step="0.1" min="0" value="${a.toFixed(1)}" ${busy?'disabled':''} onchange="cutNum(${m.rank},+this.value,null)"></div>
        <div class="f"><label>END (s)</label><input class="tx" type="number" step="0.1" min="0" value="${(a+d).toFixed(1)}" ${busy?'disabled':''} onchange="cutNum(${m.rank},null,+this.value)"></div></div>
      <div class="cutmsg" id="cm${m.rank}">${busy?'Working on the reel — cutting unlocks when it finishes.':''}</div></div>`
      :mine?`<div class="cutmsg">Getting the new shot — usually 20-40 s. The other clips stay editable.</div>`:''}
    ${(m.cands||[]).length?`<div class="cands">${m.cands.map(c=>{const on=c.url===(mine&&m.want?m.want:m.pick);
      return `<button class="cand ${on?'on':''}" title="${esc(c.title)} · ${views(c.views)} views" onclick="pick(${m.rank},'${esc(c.url)}',this)" ${lock?'disabled':''}>
      <img loading="lazy" src="${esc(c.thumb)}" alt=""><i class="${c.vertical?'v':''}">${c.vertical?'9:16':'16:9'} ${views(c.views)}</i></button>`}).join('')}</div>`:''}
    <div class="row2"><input class="tx" placeholder="Swap in a TikTok / Short / Reel link" ${lock?'disabled':''} onkeydown="if(event.key==='Enter')pick(${m.rank},this.value)">
      <button class="b sm ico" ${lock?'disabled':''} title="Search again" onclick="requery(${m.rank})">${ic('search')}</button><button class="b sm ico ghost bad" ${lock?'disabled':''} title="Drop this moment" onclick="dropM(${m.rank})">${ic('trash')}</button></div>
    </div></div>`}
function clips(p){const busy=p.state==='running';return clipsHead()+`<div class="cg">`+(p.moments||[]).map(m=>rowHtml(m,busy)).join('')+`</div>`}
// clips view is synced ROW BY ROW: a row is rebuilt only when ITS data changed, so polling can keep running while you
// watch a clip, and a swap on one clip never resets the videos / cut tools of the others.
function syncClips(b,p){const busy=p.state==='running';
  if(b._mode!=='clips'||!document.getElementById('cg')){b._mode='clips';b._h='';b.innerHTML=clipsHead()+'<div class="cg" id="cg"></div>';MI.hydrate&&MI.hydrate(b)}
  const cg=document.getElementById('cg'),want=new Set();
  (p.moments||[]).forEach((m,i)=>{const id='cc'+m.rank,h=rowHtml(m,busy);want.add(id);let el=document.getElementById(id);
    if(!el||el._h!==h){const t=document.createElement('div');t.innerHTML=h;const n=t.firstElementChild;n._h=h;
      if(el)el.replaceWith(n);else cg.appendChild(n);MI.hydrate&&MI.hydrate(n);el=n}
    if(cg.children[i]!==el)cg.insertBefore(el,cg.children[i]||null)});
  [...cg.children].forEach(c=>{if(!want.has(c.id))c.remove()})}
// playhead follows the video; "Play cut" stops at the cut's end
function vTick(v){const r=v.id.slice(1),ph=document.getElementById('ph'+r),ln=+v.dataset.ln||v.duration||1;if(ph)ph.style.left=(Math.min(1,v.currentTime/ln)*100)+'%';
  if(v.dataset.cut==='1'&&v.currentTime>=(+v.dataset.a)+(+v.dataset.d)){v.pause();v.dataset.cut=''}}
function playCut(rank){const v=document.getElementById('v'+rank);if(!v)return;v.currentTime=+v.dataset.a;v.dataset.cut='1';v.muted=false;v.play().catch(()=>{})}
function tlSeek(e,rank){const v=document.getElementById('v'+rank),r=e.currentTarget.getBoundingClientRect();if(!v)return;
  v.currentTime=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*(+v.dataset.ln||v.duration||0);v.dataset.cut=''}
// Set start/end never errors: a start past the end (or an end before the start) moves the window and keeps its length.
async function cutNum(rank,start,end){const m=CUR.moments.find(x=>x.rank===rank);if(!m)return;
  const ln=+m.length||1e9;let a=+m.trimIn||0,e=a+(+m.dur||6);const d=Math.min(12,Math.max(2.5,e-a));
  if(start!==null){a=start;if(e-a<2.5||e-a>12)e=a+d}
  if(end!==null){e=end;if(e-a<2.5||e-a>12)a=e-d}
  a=Math.max(0,a);e=Math.min(ln,e);if(e-a<2.5)a=Math.max(0,e-2.5);
  await edit({clips:[{rank,trimIn:+a.toFixed(2),dur:+(e-a).toFixed(2)}]});rowSync(rank)}
// update ONE row in place (no full repaint: the other videos keep playing / keep their position)
function rowSync(rank){const m=CUR.moments.find(x=>x.rank===rank),row=document.getElementById('cc'+rank);if(!m||!row)return;
  const a=+m.trimIn||0,d=+m.dur||6,ln=+m.length||Math.max(a+d,1),v=document.getElementById('v'+rank);
  if(v){v.dataset.a=a;v.dataset.d=d}
  const w=row.querySelector('.tl .win');if(w){w.style.left=(a/ln*100)+'%';w.style.width=(d/ln*100)+'%'}
  const hd=row.querySelector('.cut .hd');if(hd){hd.querySelector('b').textContent=tc(a)+' → '+tc(a+d);const sp=hd.lastElementChild;if(sp&&sp.tagName==='SPAN')sp.textContent='('+d.toFixed(1)+' s of '+tc(ln)+')'}
  const ins=row.querySelectorAll('.cutb input');if(ins[0])ins[0].value=a.toFixed(1);if(ins[1])ins[1].value=(a+d).toFixed(1);
  const cm=document.getElementById('cm'+rank);if(cm)cm.textContent='Saved · '+tc(a)+' → '+tc(a+d);
  row._h=rowHtml(m,CUR.state==='running')}       // the row's markup now matches the screen → the next poll won't rebuild it
function setCut(rank,which){const v=document.getElementById('v'+rank);if(!v)return;const t=+v.currentTime.toFixed(1);
  return which==='start'?cutNum(rank,t,null):cutNum(rank,null,t)}
async function clipEd(rank,k,val){await edit({clips:[{rank,[k]:val}]});$('#body')._h='';refresh()}
function pick(rank,url,btn){if(!url)return;
  if(btn){const row=btn.closest('.cands');row&&row.querySelectorAll('.cand').forEach(c=>c.classList.toggle('on',c===btn));btn.disabled=true}
  act('pick',{rank,url:String(url).trim()})}
function requery(rank){const m=CUR.moments.find(x=>x.rank===rank);const q=prompt('Search for this moment:',m.query);if(q===null)return;
  edit({clips:[{rank,query:q}]}).then(()=>act('requery',{rank}))}
function dropM(rank){if(confirm('Drop this moment from the ranking?'))act('drop',{rank})}

/* SCRIPT */
function script(p){const ms=(p.moments||[]).filter(m=>m.status==='ready');
  return `<div class="sh">${ic('note')} Script</div><div class="sg"><div class="box">
    <div class="fld"><label>Title</label><div class="h">Always two lines — Enter splits them.</div><textarea rows="2" onchange="edit({title:this.value}).then(paint)">${esc(p.title)}</textarea></div>
    <div class="fld"><label>Highlight words</label><div class="h">Coloured teal in the title (comma separated).</div><input class="tx" value="${esc(p.keywords)}" onchange="edit({keywords:this.value}).then(paint)"></div>
    <div class="fld"><label>Voice</label><div class="row2"><select class="tx" id="svo" onchange="edit({voice:this.value})">${vOpts(p.voice)}</select><button class="b ico" title="Hear it" onclick="vPlay('#svo')">${ic('play')}</button></div></div>
    <div class="fld"><label>Voice-over lines</label><div class="h">One short line per clip — the spoken verdict, also shown as a caption.</div>
      ${ms.map(m=>`<div class="vrow"><img src="${esc(m.thumb||'')}" alt=""><b>#${m.rank} ${esc(m.label)}</b><input class="tx" value="${esc(m.verdict)}" placeholder="(no voice-over)" onchange="edit({clips:[{rank:${m.rank},verdict:this.value}]})"></div>`).join('')}</div>
    <div style="display:flex;gap:8px;margin-top:14px"><button class="b sm" onclick="redo('script')">${ic('wand')} Rewrite all lines</button>
      <button class="b sm" onclick="edit({seed:Math.floor(Math.random()*9000)+1}).then(()=>alert('Play order reshuffled — #1 still plays last.'))">${ic('shuffle')} Reshuffle order</button></div></div>
    <div class="prev"><div class="phone"><div class="tb">${titleHtml(p.title,p.keywords)}</div>${ms[0]&&ms[0].thumb?`<img src="${esc(ms[0].thumb)}" alt="">`:''}
      <div class="ld">${ms.map(m=>`${m.rank}. ${esc(m.label)}`).join('<br>')}</div></div><div class="sub" style="color:var(--faint);font-size:11px;margin-top:6px;text-align:center">Layout preview</div></div></div>`}
function approveScript(){act('approve')}

/* FINAL */
function final(p){const r=p.render||{};
  if(!r.src)return `<div class="empty">${ic('video')} ${p.state==='running'?'Rendering…':'No render yet.'}</div>`;
  return `<div class="sh">${ic('video')} Final cut</div><div class="fin"><video controls playsinline src="${esc(r.url)}"></video><div class="box"><div class="kv">
    <span>Length</span><span>${r.secs?Math.round(r.secs)+' s':'—'}</span><span>Library</span><span><code>${esc(r.src.split(':').pop())}</code></span>
    <span>Saved to</span><span><code>${esc(r.copy||'—')}</code></span><span>Motion Studio</span><span>Project “${esc(p.title.replace(/\n/g,' '))}” — open it in Motion Studio to fine-tune</span>
    ${p.post?`<span>Social</span><span>Draft made — approve it in Social</span>`:''}</div>
    <div class="sh" style="margin-top:18px">${ic('link')} Sources <span class="x">· credit them in the description</span></div>
    ${(p.moments||[]).filter(m=>m.pick).map(m=>`<div style="font-size:12px;margin:3px 0">#${m.rank} ${esc(m.label)} — <a style="color:var(--cyan)" href="${esc(m.pick)}" target="_blank" rel="noopener">${esc(m.pick)}</a></div>`).join('')}
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap"><a class="b sm" href="${esc(r.url)}?dl=1">${ic('download')} Download</a><button class="b sm" onclick="redo('render')">${ic('refresh')} Re-render</button></div></div></div>`}

function xClose(){let ov=false;try{ov=!!(window.frameElement&&/^(mml-rr|f)$/.test(window.frameElement.id))}catch(e){}
  if(ov)parent.postMessage({mml:'rankreel-close'},'*');else location.replace('./')}
{const q=new URLSearchParams(location.search);if(q.get('run'))SEL=q.get('run')}
loadVoices().finally(refresh);
setInterval(()=>{const a=document.activeElement;if(document.hidden||(a&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))||$('#nd').open
  )return;refresh()},4000);
</script>
</body>
