<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MIR MEDIA LABS · Stage</title>
<link rel="icon" href="static/icon-512.png">
<link rel="stylesheet" href="static/studio.css">
<script type="importmap">{"imports":{"three":"/static/three/build/three.module.js","three/addons/":"/static/three/examples/jsm/"}}</script>
<style>
.sg{display:grid;grid-template-columns:200px 1fr 300px;grid-template-rows:52px 1fr 64px;height:100vh;overflow:hidden}
.sg-top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 14px;border-bottom:1px solid var(--line)}
.sg-left,.sg-right{padding:12px;overflow:auto;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.sg-right{border-right:0;border-left:1px solid var(--line)}
.sg-view{position:relative;display:flex;align-items:center;justify-content:center;background:#1b1b1a;overflow:hidden}
.sg-view canvas{display:block;max-width:100%;max-height:100%;outline:1px solid var(--line2)}
.sg-bot{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 14px;border-top:1px solid var(--line)}
.sg h4{margin:8px 0 2px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
.sg label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim)}
.sg select,.sg textarea,.sg input[type=number]{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:7px 9px;color:var(--ink)}
.sg textarea{min-height:92px;resize:vertical}
.sg .row{display:flex;gap:6px;flex-wrap:wrap}.sg .row .eb{flex:1}
.sg input[type=range]{width:100%;accent-color:var(--acc)}
.sg .eb.on{border-color:var(--acc);color:var(--acc)}
.sg .pri{background:var(--acc);color:#1a1a19;border-color:var(--acc);font-weight:600}
#sg-time{flex:1}
#sg-hud{position:absolute;left:12px;top:10px;font-size:12px;color:var(--dim);pointer-events:none}
#sg-msg{color:var(--dim);font-size:12px}
@media (max-width:900px){.sg{grid-template-columns:1fr;grid-template-rows:52px 46vh auto auto 64px;height:auto;min-height:100vh;overflow:visible}
  .sg-left,.sg-right{border:0;border-top:1px solid var(--line)}.sg-view{grid-row:2}}
</style>
</head>
<body>
<div class="sg">
  <header class="sg-top">
    <a class="eb ic" id="sg-back" title="Back to Studio"><i class="mi" data-ic="arrow-left"></i></a>
    <div class="st-brand"><i class="mi" data-ic="mesh"></i><b>STAGE</b><small class="dim">block the shot in grey clay, then let LTX-2.5 paint it</small></div>
    <span class="sp"></span><span id="sg-msg"></span>
  </header>
  <aside class="sg-left">
    <h4>Add</h4>
    <button class="eb" data-add="person"><i class="mi" data-ic="user"></i>Person</button>
    <button class="eb" data-add="box"><i class="mi" data-ic="rect"></i>Box</button>
    <button class="eb" data-add="ball"><i class="mi" data-ic="circle"></i>Ball</button>
    <button class="eb" data-add="pillar"><i class="mi" data-ic="tiles"></i>Pillar</button>
    <button class="eb" data-add="wall"><i class="mi" data-ic="grid"></i>Wall</button>
    <button class="eb" data-add="car"><i class="mi" data-ic="truck"></i>Car</button>
    <h4>Selected</h4>
    <div id="sg-sel" class="dim" style="font-size:12px">Click a shape. Drag it on the floor.</div>
    <label>Size<input type="range" id="sg-scale" min="0.2" max="4" step="0.05" value="1"></label>
    <label>Turn<input type="range" id="sg-rot" min="-180" max="180" step="1" value="0"></label>
    <label>Lift<input type="range" id="sg-lift" min="0" max="4" step="0.05" value="0"></label>
    <div class="row"><button class="eb" id="sg-end" title="Where this shape ends up at the end of the shot">Set end spot</button></div>
    <div class="row"><button class="eb" id="sg-dup">Copy</button><button class="eb" id="sg-del">Delete</button></div>
  </aside>
  <section class="sg-view" id="sg-view"><div id="sg-hud"></div></section>
  <aside class="sg-right">
    <h4>Frame</h4>
    <div class="row"><select id="sg-aspect"><option value="16:9">16:9</option><option value="9:16">9:16</option><option value="1:1">1:1</option></select>
      <select id="sg-q"><option value="480p">480p</option><option value="720p">720p</option></select></div>
    <label>Length <span id="sg-secs-v"></span><input type="range" id="sg-secs" min="2" max="5" step="0.5" value="4"></label>
    <h4>Camera</h4>
    <label>Lens <span id="sg-lens-v"></span><input type="range" id="sg-lens" min="14" max="135" step="1" value="35"></label>
    <label>Move<select id="sg-move">
      <option value="static">Locked off</option><option value="pushin">Push in</option><option value="pullback">Pull back</option>
      <option value="orbitl">Orbit left</option><option value="orbitr">Orbit right</option><option value="crane">Crane up</option>
      <option value="panl">Pan left</option><option value="panr">Pan right</option><option value="truck">Truck sideways</option>
      <option value="keys">My keys (start → end)</option></select></label>
    <div class="row"><button class="eb" id="sg-k0">Set start</button><button class="eb" id="sg-k1">Set end</button></div>
    <h4>Shot</h4>
    <label>What it looks like<textarea id="sg-prompt" placeholder="A rainy neon street at night. A woman in a red coat walks toward the camera past a parked taxi…"></textarea></label>
    <label>Era look<select id="sg-era"><option value="0">Off</option><option>1960</option><option>1970</option><option>1980</option><option>1990</option><option>2000</option><option>2010</option><option>2020</option></select></label>
    <label>Speed ramp<select id="sg-ramp"><option value="linear">None</option><option value="slowmo">Slow motion</option><option value="rampup">Ramp up</option><option value="impact">Impact</option><option value="bullet">Bullet time</option></select></label>
  </aside>
  <footer class="sg-bot">
    <button class="eb ic" id="sg-play" title="Play the camera move"><i class="mi" data-ic="play"></i></button>
    <input type="range" id="sg-time" min="0" max="1" step="0.001" value="0">
    <span id="sg-frames" class="dim"></span>
    <button class="eb pri" id="sg-go"><i class="mi" data-ic="film"></i>Render shot in Studio</button>
  </footer>
</div>
<script>(function(){var m=false;document.write('<script src="'+(m?'/static/icons/mir-icons.js':'/static/mir-icons.js')+'"><\/script>');})();</script>
<script type="module" src="static/stage.js"></script>
</body>
</html>
